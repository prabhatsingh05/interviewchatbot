<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Interview Setup</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      color: #fff;
    }
    a { text-decoration: none; color: inherit; }

    /* Header */
    header {
      width: 100%;
      padding: 20px 50px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top:0; left:0; right:0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
    }
    .logo { font-family: 'Share Tech Mono', monospace; font-size: 24px; color:#00ffcc; letter-spacing:1px; transition: transform 0.3s ease; }
    .logo:hover { transform: scale(1.1); color:#00d1ff; }

    nav ul { list-style:none; display:flex; gap:30px; }
    nav ul li { position: relative; }
    nav ul li a { font-weight:500; position: relative; display:inline-block; transition:0.3s; }
    nav ul li a::after {
      content: '';
      position: absolute;
      left: 0; bottom: -4px;
      width: 0%;
      height: 2px;
      background: #00ffcc;
      transition: 0.3s;
    }
    nav ul li a:hover::after { width: 100%; }
    nav ul li a:hover { color:#00ffcc; }

    /* Background shapes */
    .bg-shape { position:absolute; border-radius:50%; opacity:0.08; animation: float 15s ease-in-out infinite; z-index:0; }
    .bg-shape:nth-child(1){ width:250px;height:250px;background:#00ffcc;top:10%;left:5%; }
    .bg-shape:nth-child(2){ width:350px;height:350px;background:#ff7b72;top:50%;left:65%;animation-duration:18s; }
    .bg-shape:nth-child(3){ width:180px;height:180px;background:#1e90ff;top:80%;left:15%;animation-duration:16s; }
    @keyframes float {0%,100%{transform:translateY(0) translateX(0) rotate(0deg);} 50%{transform:translateY(-40px) translateX(30px) rotate(45deg);} }

    /* Main container */
    .container {
      position: relative;
      max-width: 900px;
      background-color: rgba(15,15,15,0.95);
      margin: 150px auto 50px auto;
      padding: 50px 40px;
      border-radius: 25px;
      box-shadow: 0 0 40px rgba(0,255,204,0.5), inset 0 0 25px rgba(0,255,204,0.2);
      text-align: center;
      backdrop-filter: blur(8px);
      animation: fadeIn 1s ease forwards;
      z-index: 1;
    }
    @keyframes fadeIn { 0% { opacity:0; transform:translateY(-30px);} 100%{opacity:1; transform:translateY(0);} }

    h2 { font-family: 'Share Tech Mono', monospace; font-size:36px; color:#00ffcc; margin-bottom:35px; text-shadow:0 0 20px #00ffcc; }

    form { display:flex; flex-direction:column; gap:25px; }
    label { font-weight:600; font-size:16px; color:#b0b0b0; letter-spacing:0.05em; display:flex; align-items:center; gap:10px; }
    select {
      width:100%; padding:16px 20px; border-radius:12px; border:2px solid #333;
      background: rgba(30,30,30,0.95); color:#fff; font-size:16px; cursor:pointer; transition:0.3s;
      appearance:none;
      background-image:
        linear-gradient(45deg, transparent 50%, #00ffcc 50%),
        linear-gradient(135deg, #00ffcc 50%, transparent 50%);
      background-position: calc(100% - 20px) calc(1em + 2px), calc(100% - 15px) calc(1em + 2px);
      background-size: 6px 6px;
      background-repeat: no-repeat;
    }
    select:hover{ border-color:#00ffcc; } 
    select:focus{ outline:none; border-color:#00ffcc; box-shadow:0 0 16px #00ffcc; background-color:#111; }

    .btn {
      background: linear-gradient(90deg, #00ffcc, #00d1ff);
      border:none; padding:16px; border-radius:14px; color:#121212; font-weight:700; font-size:18px;
      cursor:pointer; text-transform:uppercase; letter-spacing:0.12em; transition:0.4s;
      box-shadow:0 0 16px #00ffcc; display:flex; align-items:center; justify-content:center; gap:10px;
    }
    .btn:hover { background: linear-gradient(90deg,#ff7b72,#ffb97b); box-shadow:0 0 26px #ff7b72; transform:scale(1.05);}
    .btn i{ transition:0.3s; } .btn:hover i{ transform:translateX(6px); }

    /* Footer */
    footer {
      width:100%; padding:20px 50px; text-align:center; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
      color:#b0b0b0; display:flex; flex-direction:column; gap:10px;
    }
    footer a{ color:#00ffcc; transition:0.3s; }
    footer a:hover{ color:#fff; }

    /* Responsive */
    @media (max-width: 600px) {
      header, footer { padding:15px 20px; }
      .container { padding:40px 20px; margin:120px 15px 30px; }
      h2{ font-size:30px; }
      select{ font-size:15px; }
      .btn{ font-size:16px; padding:14px; }
      nav ul { gap:15px; flex-wrap:wrap; justify-content:center; }
    }
  </style>
</head>
<body>
  <!-- Background shapes -->
  <div class="bg-shape"></div>
  <div class="bg-shape"></div>
  <div class="bg-shape"></div>

  <!-- Header -->
  <header>
    <div class="logo"><i class="fas fa-robot"></i> AI Interview</div>
    <nav>
      <ul>
        <li><a href="structure.html">Home</a></li>
        <li><a href="feedback.html">Feedback</a></li>
        <li><a href="my_history.html">My History</a></li> <!-- Added My History link -->
        <li><a href="#">Contact</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Form Container -->
  <div class="container" role="main" aria-labelledby="pageTitle">
    <h2 id="pageTitle">🚀 Setup Interview</h2>
    <form id="setupForm" aria-describedby="formInstructions">
      <label for="role">👤 Target Role</label>
      <select id="role" required>
        <option value="">-- Select Role --</option>
        <option value="Software Engineer">Software Engineer</option>
        <option value="Product Manager">Product Manager</option>
      </select>

      <label for="domain">🛠 Select Domain</label>
      <select id="domain" required>
        <option value="">-- Select Domain --</option>
        <option value="Frontend">Frontend</option>
        <option value="Backend">Backend</option>
        <option value="Machine Learning">Machine Learning</option>
      </select>

      <label for="mode">🎯 Interview Mode</label>
      <select id="mode" required>
        <option value="">-- Select Mode --</option>
        <option value="Technical">Technical</option>
        <option value="Behavioral">Behavioral</option>
      </select>

      <label for="difficulty">📊 Select Difficulty</label>
      <select id="difficulty" required>
        <option value="">-- Select Difficulty --</option>
        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Advanced">Advanced</option>
      </select>

      <button class="btn" type="submit">Start Interview <i class="fas fa-rocket"></i></button>
    </form>
  </div>

  <!-- Footer -->
  <footer>
    <div>© 2025 AI Interview. All rights reserved.</div>
    <div><a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></div>
  </footer>

  <script>
    document.getElementById("setupForm").onsubmit = function(e){
      e.preventDefault();
      const role = document.getElementById("role").value;
      const domain = document.getElementById("domain").value;
      const mode = document.getElementById("mode").value;
      const difficulty = document.getElementById("difficulty").value;
      if(!role || !domain || !mode || !difficulty){
        alert('Please select all options.');
        return;
      }
      localStorage.setItem("interviewSetup", JSON.stringify({role, domain, mode, difficulty}));
      window.location.href = "interview.html";
    }
  </script>
</body>
</html>
